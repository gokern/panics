version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gci
    - golines
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    gofmt:
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"

linters:
  default: all
  disable:
    - wsl # Deprecated, replaced by wsl_v5.
    - gomodguard # Deprecated, replaced by gomodguard_v2.
    - exhaustruct # Deprecated, replaced by exhaustruct_v5.
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/gokern/panics
            - github.com/stretchr/testify
    varnamelen:
      ignore-names:
        - fn
        - i
        - ok
      ignore-decls:
        - p *Panic
        - p *panics.Panic
        - rv reflect.Value
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - err113
          - exhaustruct_v5
